name: Release

# Crie uma tag (ex.: git tag v0.1.0 && git push --tags) para gerar
# os instaladores de Windows e Linux e publicar a release.
on:
  push:
    tags: ["v*"]

jobs:
  instaladores:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Finanças Locais ${{ github.ref_name }}"
          releaseBody: "Baixe o instalador do seu sistema em Assets: Windows (.msi ou -setup.exe) ou Linux (.deb ou .AppImage). Veja o README para instruções."
          releaseDraft: false
          prerelease: false
