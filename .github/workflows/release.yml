name: Release

# Gera os instaladores de Windows e Linux e publica a release.
#
# Roda sozinho quando a versão em src-tauri/tauri.conf.json muda na main
# (a tag vX.Y.Z é criada automaticamente a partir dessa versão).
# Também dá para rodar à mão: Actions → Release → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  instaladores:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Finanças Locais v__VERSION__"
          releaseBody: "Baixe o instalador do seu sistema em Assets: Windows (-setup.exe ou .msi) ou Linux (.deb ou .AppImage). Veja o README para instruções."
          releaseDraft: false
          prerelease: false
